  const m=text.match(/(-?\d{2}\.\d{3,8})\s*[,\s]\s*(-?\d{2,3}\.\d{3,8})/);
  if(!m)return null;
  const lat=parseFloat(m[1]),lon=parseFloat(m[2]);
  if(!Number.isFinite(lat)||!Number.isFinite(lon))return null;
  if(lat<-90||lat>90||lon<-180||lon>180)return null;
  return[lat,lon];
}

const AI=(()=>{
  const W={channel:.30,confirmations:.25,freshness:.15,hasCoords:.10,hardClassifier:.10,hasTarget:.10};
  const LEVELS={critical:.75,high:.55,medium:.35};
  function score(ctx){
    const now=Date.now();
    const ageMin=Math.max(0,(now-(ctx.firstSeen||now))/60000);
    const channels=ctx.channels instanceof Set?ctx.channels:new Set(ctx.channels||[]);
    const chWeight=[...channels].reduce((s,c)=>s+channelWeight(c),0);
    const chAvg=channels.size?chWeight/channels.size:0;
    const chScore=Math.min(chAvg/2,1);
    const confScore=Math.min(channels.size/4,1);
    const freshScore=Math.max(0,1-ageMin/30);
    const geoScore=(ctx.place&&ctx.place.lat!=null)?1:.3;
    const hardScore=(ctx.cls&&ctx.cls.hard)?1:.4;
    const targetScore=ctx.target?1:.2;
    const total=W.channel*chScore+W.confirmations*confScore+W.freshness*freshScore+W.hasCoords*geoScore+W.hardClassifier*hardScore+W.hasTarget*targetScore;
    let level="low";
    if(total>=LEVELS.critical)level="critical";
    else if(total>=LEVELS.high)level="high";
    else if(total>=LEVELS.medium)level="medium";
    return{total:Math.round(total*100)/100,level};
  }
  const LEVEL_META={
    critical:{color:"#fecaca",bg:"rgba(220,38,38,.35)",border:"#dc2626",label:"КРИТИЧНО"},
    high:{color:"#fed7aa",bg:"rgba(234,88,12,.3)",border:"#ea580c",label:"ВЫСОКАЯ"},
    medium:{color:"#fef08a",bg:"rgba(202,138,4,.3)",border:"#ca8a04",label:"СРЕДНЯЯ"},
    low:{color:"#cbd5e1",bg:"rgba(148,163,184,.2)",border:"#94a3b8",label:"НИЗКАЯ"}
  };
  function badgeHtml(r){
    if(!r)return"";
    const m=LEVEL_META[r.level]||LEVEL_META.low;
    return `<div class="ai-badge" style="background:${m.bg};color:${m.color};border-color:${m.border}">🤖 ${m.label} · ${Math.round(r.total*100)}%</div>`;
  }
  function moderate(text){
    const t=(text||"").trim();
    if(!t||t.length<8)return{ok:false};
    return{ok:true};
  }
  return{score,moderate,badgeHtml,LEVEL_META};
})();

let audioCtx=null,lastSoundAt=0,keepAliveInterval=null;
function initAudio(){
  if(audioCtx)return audioCtx;
  try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;audioCtx=new Ctx();startKeepAlive();}catch(e){}
  return audioCtx;
}
function startKeepAlive(){
  if(keepAliveInterval)return;
  keepAliveInterval=setInterval(()=>{
    if(!audioCtx)return;
    try{if(audioCtx.state==="suspended"){audioCtx.resume().catch(()=>{});return;}
      const o=audioCtx.createOscillator();const g=audioCtx.createGain();
      o.type="sine";o.frequency.setValueAtTime(1,audioCtx.currentTime);
      g.gain.setValueAtTime(0.00001,audioCtx.currentTime);
      o.connect(g);g.connect(audioCtx.destination);
      o.start();o.stop(audioCtx.currentTime+0.05);}catch(e){}
  },20000);
}
function unlockAudio(){const ctx=initAudio();if(ctx&&ctx.state==="suspended")ctx.resume().catch(()=>{});}
function playBell(){
  if(!audioCtx)return;
  const now=audioCtx.currentTime;
  for(const p of [{freq:880,gain:.30,decay:1.1},{freq:1760,gain:.14,decay:.7},{freq:2640,gain:.07,decay:.45}]){
    const o=audioCtx.createOscillator();const g=audioCtx.createGain();
    o.type="sine";o.frequency.setValueAtTime(p.freq,now);
    g.gain.setValueAtTime(.0001,now);
    g.gain.exponentialRampToValueAtTime(p.gain,now+.012);
    g.gain.exponentialRampToValueAtTime(.0001,now+p.decay);
    o.connect(g);g.connect(audioCtx.destination);
    o.start(now);o.stop(now+p.decay+.05);
  }
}
function playAlertSound(force){
  if(!CONFIG.SOUND_ENABLED)return;
  const now=Date.now();
  if(!force&&now-lastSoundAt<CONFIG.SOUND_COOLDOWN_MS)return;
  lastSoundAt=now;
  const ctx=initAudio();if(!ctx)return;
  try{if(ctx.state==="suspended")ctx.resume();playBell();}catch(e){}
}
const firedSoundKeys=new Map();
function isRocketType(type){return CONFIG.ROCKET_TYPES.has(type);}
function fireSirenForTarget(key,clsLike){
  if(!clsLike)return false;
  if(!CONFIG.SOUND_TYPE_FILTER.has(clsLike.type)&&!clsLike.isGeran5)return false;
  const now=Date.now();
  const last=firedSoundKeys.get(key)||0;
  const win=isRocketType(clsLike.type)?CONFIG.SOUND_NEAR_WINDOW_MS_ROCKET:CONFIG.SOUND_NEAR_WINDOW_MS;
  if(now-last<win)return false;
  firedSoundKeys.set(key,now);
  if(firedSoundKeys.size>300){const cutoff=now-10*60*1000;for(const[k,t]of firedSoundKeys)if(t<cutoff)firedSoundKeys.delete(k);}
  playAlertSound(true);return true;
}

    {re:/оникс|ониx|oniks|p-?800/i,type:"missile",label:"Оникс",isMissile:true}

    {re:/fpv|фпв/i,type:"fpv",label:"FPV"},

function simulateMovement(o){
  if(!o||!o.marker)return;
  if(o._simulated)return;
  o._simulated=true;
  const chain=o.chainKey?trails.get(o.chainKey):null;
  if(!chain)return;
  const speed=o.speedKmh||resolveSpeedKmh(o.cls.type,"");
  const heading=(o.heading!=null)?o.heading:null;
  if(heading==null)return;
  const startLL=o.marker.getLatLng();
  if(!startLL)return;
  const bearingToKyiv=bearingBetween(startLL.lat,startLL.lng,CONFIG.KYIV[0],CONFIG.KYIV[1]);
  const headingDiff=Math.abs(((heading-bearingToKyiv+540)%360)-180);
  if(headingDiff>90)return;
  const kmPerSec=speed/3600;
  o._simTimer=setInterval(()=>{
    if(!o.marker){clearInterval(o._simTimer);return;}
    const ll=o.marker.getLatLng();
    if(!ll){clearInterval(o._simTimer);return;}
    const d=haversineKm(ll.lat,ll.lng,CONFIG.KYIV[0],CONFIG.KYIV[1]);
    const threshold=soundThresholdFor(o.cls.type);
    if(d<=threshold&&!o._sirenFired){
      o._sirenFired=true;
      maybeSirenForPlace(o.chainKey||("sim"+Math.random()),o.cls,ll.lat,ll.lng);
    }
    if(d<1){
      clearInterval(o._simTimer);
      spawnImpactAt(ll,o.cls);
      if(msgThreatLayer)try{msgThreatLayer.removeLayer(o.marker);}catch(e){}
      if(o.chainKey){msgMarkers.delete(o.chainKey);closeTrail(o.chainKey);}
      return;
    }
    const[nlat,nlon]=destPoint(ll.lat,ll.lng,bearingToKyiv,kmPerSec);
    if(!Number.isFinite(nlat)||!Number.isFinite(nlon)){clearInterval(o._simTimer);return;}
    o.marker.setLatLng([nlat,nlon]);
    const ch=o.chainKey?trails.get(o.chainKey):null;
    if(ch){
      const last=ch.points[ch.points.length-1];
      if(!last||haversineKm(last.lat,last.lon,nlat,nlon)>0.5){
        ch.points.push({lat:nlat,lon:nlon,t:Date.now(),name:"→ Київ"});
        if(ch.points.length>CONFIG.TRAIL_MAX_POINTS)ch.points.shift();
        if(ch.polyline&&map)try{ch.polyline.setLatLngs(ch.points.map(p=>[p.lat,p.lon]));}catch(e){}
      }
    }
  },1000);
}

function extractPlaceAndType(text){
  if(!text)return null;
  if(NON_AIR_CONTEXT_RE.test(text))return null;
  if(NO_LAUNCH_RE.test(text)&&!/пуск\s+вже|пуск\s+підтверджен|пуски\s+підтверджен|ракети\s+в\s+повітрі/i.test(text))return null;

  if(oblastCount>=2)return null;
  const cls=CLASSIFIER(text);
  if(!cls)return null;
  if(cls.isStrategic||cls.isMig||cls.isAwacs)return null;
  if(OBSERVATION_TYPES.has(cls.type))return null;
  const observed=getObservedPlace(text);
  const target=getTargetPlace(text);
  let place=null,isApproach=false;
  if(observed)place=observed;
  else if(target){
    const src=nearestRussianOrigin(target.lat,target.lon);
    let hdg;
    if(src.origin&&src.dist>CONFIG.TRAIL_MIN_ORIGIN_DIST_KM)hdg=bearingBetween(src.origin.lat,src.origin.lon,target.lat,target.lon);

    isApproach=true;
  }else{
    const sentences=text.split(/[.!?\n]+/);
    for(const s of sentences){
      const sentence=s.trim();
      if(!sentence)continue;
      if(!cls.re.test(sentence))continue;
      const rawPlace=findPlaceInText(sentence);
      if(rawPlace){
        const idx=text.indexOf(sentence);
        place={key:rawPlace.key,name:rawPlace.name,lat:rawPlace.lat,lon:rawPlace.lon,index:idx+rawPlace.index,length:rawPlace.length,_kyivArea:rawPlace._kyivArea};
        break;
      }
    }
  }
  if(!place)return null;
  const windowStart=Math.max(0,place.index-200);
  const windowEnd=Math.min(text.length,place.index+place.length+200);
  const sentence2=text.slice(windowStart,windowEnd);
  const localPlaceIndex=Math.max(0,place.index-windowStart);
  const typeRegex=new RegExp(cls.re.source,cls.re.flags);
  const typeMatch=typeRegex.exec(sentence2);
  if(!typeMatch)return null;
  const pEnd=localPlaceIndex+place.length;
  const tStart=typeMatch.index;
  const tEnd=tStart+typeMatch[0].length;
  const gap=pEnd<=tStart?(tStart-pEnd):(localPlaceIndex-tEnd);
  if(gap<0||gap>250)return null;
  if(!cls.hard){if(!/курс|курсом|летит|летять|руха|рухається|напрям|в\s+напрямк|у\s+бік|у\s+напрямку|збит|сбит|пада|падінн|підліта|подлета|наближ|атак|удар|пуск|загроз|угроз|висот/i.test(sentence2))return null;}
  return{place,cls,target,isApproach};
}

        const fakeThreat={type:cls.type,_altitude:null,_falling:false,_stage:"ready",_count:count||null,heading:null};
        const marker=L.marker([region.lat,region.lon],{icon:makeIcon(fakeThreat,null,false,confirmN,totalW,null,false,false,false,false,aiResult.level,"ready",false),zIndexOffset:930});
        marker.bindPopup(`<div class="popup-title">Стратегічна авіація · готовність</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b>${count?`<br>Бортов: <b>${count}</b>`:""}<br>Подтверждений: <b>${confirmN}</b></div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`);
        marker.addTo(msgThreatLayer);
        if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker&&msgThreatLayer)msgThreatLayer.removeLayer(_old.marker);}
        msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place:{name:origin.name,lat:region.lat,lon:region.lon},isRegion:true});
      }
      continue;
    }
    if(c.kind==="mig"){
      const{region,cls,origin}=c;
      if(region.lat==null||region.lon==null)continue;
      const eta=etaToKyivMin(region.lat,region.lon,cls.type);
      const marker=L.marker([region.lat,region.lon],{icon:makeIcon(cls,null,false,confirmN,totalW,eta,false,false,false,false,aiResult.level,"takeoff",false),zIndexOffset:935});
      marker.bindPopup(`<div class="popup-title">МиГ-31К · взлёт</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b><br>Подтверждений: <b>${confirmN}</b>${eta!=null?`<br>Подлёт до Киева: <b>${formatEtaMin(eta)}</b>`:""}</div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`);
      marker.addTo(msgThreatLayer);
      if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker&&msgThreatLayer)msgThreatLayer.removeLayer(_old.marker);}
      msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place:{name:origin.name,lat:region.lat,lon:region.lon},isRegion:true,eta});
      continue;
    }
    if(c.kind==="observation"){
      const{cls,target}=c;
      const place=c.origin||c.region;
      const src={missile:{lat:44.5,lon:33.5},ballistic:{lat:45,lon:34},banderol:{lat:45.3,lon:34.5},jet_drone:{lat:45.3,lon:34.5},geran5:{lat:50.5,lon:30.7},kab:{lat:47.5,lon:38},umpb:{lat:47.5,lon:38},uav:{lat:48,lon:38},recon:{lat:48,lon:38},fpv:{lat:47.5,lon:37}}[cls.type];
      let arrowBearing=0;
      if(target)arrowBearing=bearingBetween(place.lat,place.lon,target.lat,target.lon);
      else if(src)arrowBearing=(bearingBetween(place.lat,place.lon,src.lat,src.lon)+180)%360;
      const chainKey=`${cls.type}|obs|${(target&&target.key)||place.key}`;
      const chain=appendTrailPoint(chainKey,cls,{lat:place.lat,lon:place.lon,name:place.name},ch,msgMs);
      chain.aiResult=aiResult;chain.heading=arrowBearing;
      const last=chain.points[chain.points.length-1];
      const eta=etaToKyivMin(place.lat,place.lon,cls.type);
      let markerRef=chain.markerRef;
      if(markerRef&&markerRef.marker){
        markerRef.marker.setLatLng([last.lat,last.lon]);
        markerRef.marker.setIcon(makeIcon(cls,arrowBearing,false,confirmN,totalW,eta,false,false,false,false,aiResult.level,null,false));
        markerRef.marker.setPopupContent(buildTrailPopupHtml(chain));
      }else{
        const marker=L.marker([last.lat,last.lon],{icon:makeIcon(cls,arrowBearing,false,confirmN,totalW,eta,false,false,false,false,aiResult.level,null,false),zIndexOffset:900});
        marker.bindPopup(buildTrailPopupHtml(chain));
        marker.addTo(msgThreatLayer);
        marker.on("popupopen",()=>openTrail(chainKey));
        marker.on("popupclose",()=>closeTrailDrawing(chainKey));
        markerRef={marker,trailPoints:null};chain.markerRef=markerRef;
      }
      msgMarkers.set(key,{marker:markerRef.marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place,chainKey,eta});
      maybeSirenForPlace(key,cls,place.lat,place.lon);
      continue;
    }
    if(c.kind==="region"||c.kind==="origin"||c.kind==="default"||c.kind==="guess"){
      const{region,cls,stage,origin,target}=c;
      if(!inZone(region.lat,region.lon))continue;
      const eta=etaToKyivMin(region.lat,region.lon,cls.type);
      if(stage==="launch"){
        const targetBearing=target?bearingBetween(region.lat,region.lon,target.lat,target.lon):bearingBetween(region.lat,region.lon,50.45,30.52);
        const fakeThreat={type:cls.type,_altitude:null,_falling:false,_stage:"launch",heading:targetBearing};
        const marker=L.marker([region.lat,region.lon],{icon:makeIcon(fakeThreat,targetBearing,true,confirmN,totalW,eta,false,false,false,false,aiResult.level,stage,false),zIndexOffset:950});
        marker.bindPopup(`<div class="popup-title">ПУСК · ${esc(cls.label)}</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b><br>Подтверждений: <b>${confirmN}</b>${eta!=null?`<br>Подлёт: <b>${formatEtaMin(eta)}</b>`:""}</div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`);
        marker.addTo(msgThreatLayer);
        if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker&&msgThreatLayer)msgThreatLayer.removeLayer(_old.marker);}
        msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place:{name:origin.name,lat:region.lat,lon:region.lon},stage:"launch",eta});
      }else{
        const marker=L.marker([region.lat,region.lon],{icon:launcherIcon(stage,origin.name,confirmN,totalW,aiResult.level),zIndexOffset:940});
        marker.bindPopup(`<div class="popup-title">ЗАГРОЗА · ${esc(cls.label)}</div><div>${esc(c.sampleText.slice(0,220))}</div><div class="popup-meta"><b>${esc(origin.name)}</b><br>Подтверждений: <b>${confirmN}</b>${eta!=null?`<br>Подлёт: <b>${formatEtaMin(eta)}</b>`:""}</div>${channelsListHtml(c.channels)}${aiResult?AI.badgeHtml(aiResult):""}`);
        marker.addTo(msgThreatLayer);
        if(msgMarkers.has(key)){const _old=msgMarkers.get(key);if(_old.marker&&msgThreatLayer)msgThreatLayer.removeLayer(_old.marker);}
        msgMarkers.set(key,{marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,cls,place:{name:origin.name,lat:region.lat,lon:region.lon},isRegion:true,stage,eta});
      }
      continue;
    }
    if(c.kind==="place"){
      const{place,cls,target,isApproach}=c;
      if(!inZone(place.lat,place.lon)&&!(target&&inZone(target.lat,target.lon)))continue;
      const alt=c.altitudeOverride!=null?c.altitudeOverride:parseAltitude({explanationShort:c.sampleText});
      const falling=isFallingMessage(c.sampleText);
      let hdg=null;
      if(target)hdg=bearingBetween(place.lat,place.lon,target.lat,target.lon);
      else if(!isApproach){
        const{origin,dist}=nearestRussianOrigin(place.lat,place.lon);
        if(origin&&dist>=CONFIG.TRAIL_MIN_ORIGIN_DIST_KM)hdg=bearingBetween(origin.lat,origin.lon,place.lat,place.lon);
      }
      const displayPos=[place.lat,place.lon];
      const speed=resolveSpeedKmh(cls.type,c.sampleText);
      const eta=etaToKyivMin(displayPos[0],displayPos[1],cls.type,speed);
      const chainKey=`${cls.type}|${(target&&target.key)||place.key}|${(cls.isGeran5||cls.type==="geran5")?"g5":"std"}`;
      const chain=appendTrailPoint(chainKey,cls,{lat:displayPos[0],lon:displayPos[1],name:(target&&target.name)||place.name,sampleText:c.sampleText},ch,msgMs);
      chain.aiResult=aiResult;chain.heading=hdg;chain.speedKmh=speed;
      const last=chain.points[chain.points.length-1];
      let markerRef=chain.markerRef;
      const threshold=soundThresholdFor(cls.type);
      const inSirenZone=haversineKm(CONFIG.KYIV[0],CONFIG.KYIV[1],place.lat,place.lon)<=threshold;
      if(markerRef&&markerRef.marker){
        markerRef.marker.setLatLng([last.lat,last.lon]);
        markerRef.marker.setIcon(makeIcon(cls,hdg,alt,falling,confirmN,totalW,eta,false,false,false,false,aiResult.level,null,inSirenZone));
        markerRef.marker.setPopupContent(buildTrailPopupHtml(chain));
      }else{
        const marker=L.marker([last.lat,last.lon],{icon:makeIcon(cls,hdg,alt,falling,confirmN,totalW,eta,false,false,false,false,aiResult.level,null,inSirenZone),zIndexOffset:900});
        marker.bindPopup(buildTrailPopupHtml(chain));
        marker.addTo(msgThreatLayer);
        marker.on("popupopen",()=>openTrail(chainKey));
        marker.on("popupclose",()=>closeTrailDrawing(chainKey));
        markerRef={marker,trailPoints:null};chain.markerRef=markerRef;
      }
      const opts={marker:markerRef.marker,lastSeen:c.lastSeen,firstSeen:c.firstSeen,alt,falling,hdg,cls,place,targetPlace:target,eta,speedKmh:speed,chainKey,inSirenZone};
      msgMarkers.set(key,opts);
      simulateMovement(opts);
      maybeSirenForPlace(key,cls,place.lat,place.lon);
      continue;
    }
  }

  /* Очистки */
  const cutoff=now-CONFIG.IMPACT_REPORT_TTL_MS;
  for(const[key,r]of[...impactReports]){
    if(r.lastSeen<cutoff){
      if(r.marker&&impactLayer)try{impactLayer.removeLayer(r.marker);}catch(e){}
      impactReports.delete(key);
    }
  }
  const warnCutoff=now-CONFIG.WARNING_GRACE_MS;
  for(const[id,w]of[...activeWarnings]){
    if(w.dismissed)continue;
    if(w.lastSeen<warnCutoff){
      if(w.marker&&msgThreatLayer)try{msgThreatLayer.removeLayer(w.marker);}catch(e){}
      activeWarnings.delete(id);
    }
  }
  for(const[key,o]of[...msgMarkers]){
    if(now-o.lastSeen>CONFIG.STALE_MSG_MS){
      if(o.marker&&msgThreatLayer)try{msgThreatLayer.removeLayer(o.marker);}catch(e){}
      msgMarkers.delete(key);
    }
  }
  renderWarningsPanel();
}

function parsePlaceAndAltitude(text){
  if(!text)return null;
  let raw=String(text).trim();
  if(!raw||raw.length>60)return null;
  raw=raw.replace(/^[•·\-–—\s]+/,"").replace(/[\s]+$/,"");
  const m=raw.match(/^([А-ЯІЇЄҐа-яіїєґ'’\-][А-ЯІЇЄҐа-яіїєґ'’\-\s]{1,30}?)\s+(\d{1,5})\s*$/i);
  if(!m)return null;
  const placeName=m[1].trim();
  const altRaw=parseInt(m[2],10);
  let alt=null;
  if(altRaw>=500&&altRaw<=15000)alt=altRaw;
  else if(altRaw>=1&&altRaw<=15)alt=altRaw*1000;
  if(!alt)return null;
  const place=findPlaceInText(placeName);
  if(place)return{place,altitude:alt};
  return null;
}
function isJustAltitude(text){
  if(!text)return null;
  const raw=String(text).trim();
  if(raw.length>8)return null;
  const m=raw.match(/^(\d{3,5})\s*$/);
  if(!m)return null;
  const v=parseInt(m[1],10);
  if(v>=500&&v<=15000)return v;
  return null;
}

let ws=null,wsConnected=false,wsReconnectMs=CONFIG.WS_RECONNECT_MS,wsReconnectTimer=null;
let pollTimer=null;
function wsScheduleReconnect(){
  if(wsReconnectTimer)return;
  wsReconnectTimer=setTimeout(()=>{wsReconnectTimer=null;wsConnect();},wsReconnectMs);
  wsReconnectMs=Math.min(wsReconnectMs*2,CONFIG.WS_RECONNECT_MAX_MS);
}
function wsConnect(){
  try{
    if(ws){try{ws.close();}catch(e){}ws=null;}
    ws=new WebSocket(CONFIG.WS_URL);
    ws.onopen=()=>{wsConnected=true;wsReconnectMs=CONFIG.WS_RECONNECT_MS;updateLiveBadge("ok");};
    ws.onmessage=(e)=>{try{JSON.parse(e.data);}catch(err){}};
    ws.onclose=()=>{wsConnected=false;ws=null;updateLiveBadge("err");wsScheduleReconnect();};
    ws.onerror=()=>{};
  }catch(e){wsScheduleReconnect();}
}
function updateLiveBadge(state){
  const badge=$("liveBadge");if(!badge)return;
  if(state==="ok"){badge.textContent=wsConnected?"онлайн · WS":"онлайн";badge.className="live-badge live"+(wsConnected?" ws":"");}
  else{badge.textContent="ошибка";badge.className="live-badge stale";}
}
async function fetchMessages(){
  try{
    const r=await fetch(CONFIG.API_MESSAGES);
    if(!r.ok)throw new Error("messages "+r.status);
    const data=await r.json();
    try{syncMessageThreats(data.messages||[]);}catch(e){console.warn(e);}
    updateLiveBadge("ok");
  }catch(e){updateLiveBadge("err");}
}
function startPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(fetchMessages,CONFIG.POLL_MS);}

function clearAll(){
  impactReports.forEach(r=>{if(r.marker&&impactLayer)try{impactLayer.removeLayer(r.marker);}catch(e){}});
  impactReports.clear();
  msgMarkers.forEach(o=>{if(o.marker&&msgThreatLayer)try{msgThreatLayer.removeLayer(o.marker);}catch(e){}});
  msgMarkers.clear();
  activeWarnings.forEach(w=>{if(w.marker&&msgThreatLayer)try{msgThreatLayer.removeLayer(w.marker);}catch(e){}});
  activeWarnings.clear();
  for(const key of[...trails.keys()])closeTrail(key);
  trails.clear();
  renderWarningsPanel();
}

function showAIExplain(){
  const lines=[];
  lines.push("⚠️ Warnings: "+[...activeWarnings.values()].filter(w=>!w.dismissed).length);
  for(const w of [...activeWarnings.values()].filter(w=>!w.dismissed)) lines.push("   • "+w.warning.label);
  lines.push("");
  lines.push("💥 Прилётов/падений: "+impactReports.size);
  for(const r of impactReports.values()) lines.push("   • "+r.report.icon+" "+r.name+" ("+r.lat.toFixed(3)+", "+r.lon.toFixed(3)+")");
  lines.push("");
  lines.push("✈ Активных треков: "+msgMarkers.size);
  for(const o of msgMarkers.values()) lines.push("   • "+(o.cls?o.cls.label:"?")+" — "+(o.place?o.place.name:"?"));
  $("aiModalBody").textContent=lines.join("\n");
  $("aiModalTime").textContent="Обновлено: "+new Date().toLocaleTimeString("ru-RU");
  $("aiModalBackdrop").classList.add("show");
}
function hideAIExplain(){$("aiModalBackdrop").classList.remove("show");}
(function initAIModal(){
  const backdrop=$("aiModalBackdrop"),closeBtn=$("aiModalClose"),copyBtn=$("aiModalCopy");

  backdrop.addEventListener("click",(e)=>{if(e.target===backdrop)hideAIExplain();});
  if(closeBtn)closeBtn.addEventListener("click",hideAIExplain);
  document.addEventListener("keydown",(e)=>{if(e.key==="Escape"&&backdrop.classList.contains("show"))hideAIExplain();});
  if(copyBtn)copyBtn.addEventListener("click",async()=>{
    try{await navigator.clipboard.writeText($("aiModalBody").textContent||"");copyBtn.textContent="✅";setTimeout(()=>copyBtn.textContent="📋 Копировать",1500);}catch(e){}
  });
})();
